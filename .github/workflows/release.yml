name: Release

# v로 시작하는 태그(예: v1.0.0)를 푸시하면 exe를 빌드해서 GitHub Release에 올린다.
# Actions 탭에서 수동으로 돌리면 빌드만 하고 exe를 artifact로 남긴다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke test import
        run: python -c "import parry_haptic"

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name ParryHaptic --icon "${{ github.workspace }}\parry.ico"
          --hidden-import pystray._win32
          --collect-submodules scipy._external --collect-submodules scipy.signal
          --distpath dist --workpath build --specpath build
          parry_haptic.py

      - name: Check exe exists
        run: |
          if (-not (Test-Path dist\ParryHaptic.exe)) { throw "dist\ParryHaptic.exe not found" }
          Get-Item dist\ParryHaptic.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ParryHaptic
          path: dist/ParryHaptic.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # 이미 만들어 둔 릴리스가 있으면 exe만 올린다
            gh release upload $env:TAG dist/ParryHaptic.exe --clobber
          } else {
            gh release create $env:TAG dist/ParryHaptic.exe --title $env:TAG --generate-notes
          }
